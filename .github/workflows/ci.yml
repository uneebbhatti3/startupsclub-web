name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; runs on integration and main never are, so a
  # deployment is not cut off halfway by the next merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Git hooks are a local-only check; CI runs the same commands as explicit steps below.
  # HUSKY=0 makes the `prepare` script (husky) a no-op during `npm ci`.
  HUSKY: 0
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
  NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  # Sentry stays disabled in CI: empty DSN, no auth token, so no events and no source-map upload.
  NEXT_PUBLIC_SENTRY_DSN: ""

jobs:
  quality:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint, includes the no-any rule)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --pass-with-no-tests
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploys only after a merge: pushes to integration and main come only from merged pull
  # requests (repository ruleset), and this job also waits for every check on the merged commit.
  # Vercel's own Git deployments are off (vercel.json), so this job is the only way code deploys.
  # The build runs on Vercel with that environment's variables; nothing is built here.
  deploy:
    name: Deploy to Vercel
    needs: [quality, build, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/integration')
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    # A deployment in progress is never cancelled; a newer push waits for it to finish.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install Vercel CLI
        run: npm install --global vercel@65.5.0
      - name: Deploy (main = production, integration = preview)
        id: deploy
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")"
          else
            url="$(vercel deploy --yes --token="$VERCEL_TOKEN")"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
