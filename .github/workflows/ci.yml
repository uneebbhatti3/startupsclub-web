name: CI

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
  NEXT_PUBLIC_AUTH_BASE_URL: http://localhost:4000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  # Sentry stays disabled in CI: empty DSN, no auth token, so no events and no source-map upload.
  NEXT_PUBLIC_SENTRY_DSN: ""

jobs:
  quality:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fix formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint, includes the no-any rule)
        run: npm run lint
      - name: Type check (tsc)
        run: npm run typecheck

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: End-to-end tests
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --pass-with-no-tests
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
